<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda UPN - Version 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8eef7;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        .contenedor {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px #0002;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            color: #333;
        }

        p.pie {
            text-align: center;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>Tienda UPN - VERSION 1</h1>

    <div class="contenedor">
        <h2>Lista de productos</h2>
        <ul id="lista"></ul>
    </div>

    <p class="pie">Pagina creada en la rama2 - Semana 14</p>

    <script src="tienda.js"></script>
</body>
</html>
